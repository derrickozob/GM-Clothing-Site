<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — G&M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="brand-mark"><img src="images/logo.png" alt="G&M logo" class="badge">G&amp;M</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="story.html">Our Story</a>
    <a href="login.html">Log In</a>
    <a href="cart.html" class="nav-cart">Cart <span id="cart-count" class="cart-count">0</span></a>
  </div>
</nav>

<section>
  <div class="container pdp" id="pdp-root"></div>
</section>

<footer class="footer">
  G&amp;M — Gold &amp; Molly &nbsp;·&nbsp; Peace, God, and unity across cultures &nbsp;·&nbsp; Prototype build
</footer>

<script src="products.js"></script>
<script src="garments.js"></script>
<script src="cart.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const product = getProductById(params.get("id")) || PRODUCTS[0];
  let selectedSize = null;

  function draw() {
    document.getElementById("pdp-root").innerHTML = `
      <div class="pdp-swatch">
        <img src="images/logo.png" alt="G&amp;M logo" class="badge">
        ${garmentSVG(product.category, product.fill, product.ink, { fontSize: 20 })}
      </div>
      <div>
        <h1 class="pdp-title">${product.name}</h1>
        <div class="pdp-price">${formatPrice(product.price)}</div>

        <span class="field-label">Size</span>
        <div class="size-row" id="size-row">
          ${product.sizes.map(s => `<button class="size-chip" data-size="${s}">${s}</button>`).join("")}
        </div>

        <button class="btn btn-solid btn-full" id="add-btn">Add to Cart</button>
        <div class="stock-note">In stock &middot; ships in 3–5 business days</div>

        <div class="pdp-details">
          <p>${product.details}</p>
          <p><strong>Fabric:</strong> ${product.fabric}</p>
        </div>
      </div>
    `;

    document.querySelectorAll(".size-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedSize = btn.dataset.size;
        document.querySelectorAll(".size-chip").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });

    document.getElementById("add-btn").addEventListener("click", () => {
      if (!selectedSize) {
        showToast("Pick a size first");
        return;
      }
      addToCart(product.id, selectedSize, 1);
      showToast(`Added ${product.name} (${selectedSize}) to cart`);
    });
  }

  draw();
</script>
</body>
</html>

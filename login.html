<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — G&M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="brand-mark"><img src="images/logo.png" alt="G&M logo" class="badge">G&amp;M</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="story.html">Our Story</a>
    <a href="login.html">Log In</a>
    <a href="cart.html" class="nav-cart">Cart <span id="cart-count" class="cart-count">0</span></a>
  </div>
</nav>

<div class="auth-wrap" id="auth-wrap"></div>

<footer class="footer">
  G&amp;M — Gold &amp; Molly &nbsp;·&nbsp; Peace, God, and unity across cultures &nbsp;·&nbsp; Prototype build
</footer>

<script src="cart.js"></script>
<script>
  let mode = "login"; // or "signup"

  function draw() {
    const wrap = document.getElementById("auth-wrap");
    if (mode === "login") {
      wrap.innerHTML = `
        <h1 class="auth-title">Log In</h1>
        <form class="form-grid" id="auth-form">
          <div class="field">
            <label for="l-email">Email</label>
            <input id="l-email" type="email" required>
          </div>
          <div class="field">
            <label for="l-password">Password</label>
            <input id="l-password" type="password" required>
          </div>
          <button type="submit" class="btn btn-solid btn-full" style="margin-top:6px;">Log In</button>
        </form>
        <div class="auth-switch">Don't have an account? <a href="#" id="switch-link">Sign up</a></div>
      `;
    } else {
      wrap.innerHTML = `
        <h1 class="auth-title">Sign Up</h1>
        <form class="form-grid" id="auth-form">
          <div class="field">
            <label for="s-name">Full name</label>
            <input id="s-name" type="text" required>
          </div>
          <div class="field">
            <label for="s-email">Email</label>
            <input id="s-email" type="email" required>
          </div>
          <div class="field">
            <label for="s-password">Password</label>
            <input id="s-password" type="password" required>
          </div>
          <button type="submit" class="btn btn-solid btn-full" style="margin-top:6px;">Create Account</button>
        </form>
        <div class="auth-switch">Already have an account? <a href="#" id="switch-link">Log in</a></div>
      `;
    }

    document.getElementById("switch-link").addEventListener("click", (e) => {
      e.preventDefault();
      mode = mode === "login" ? "signup" : "login";
      draw();
    });

    document.getElementById("auth-form").addEventListener("submit", (e) => {
      e.preventDefault();
      showToast(mode === "login" ? "Logged in (prototype only)" : "Account created (prototype only)");
    });
  }

  draw();
</script>
</body>
</html>

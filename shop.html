<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — G&M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="brand-mark"><img src="images/logo.png" alt="G&M logo" class="badge">G&amp;M</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="story.html">Our Story</a>
    <a href="login.html">Log In</a>
    <a href="cart.html" class="nav-cart">Cart <span id="cart-count" class="cart-count">0</span></a>
  </div>
</nav>

<section>
  <div class="container shop-layout">
    <aside class="filter-panel">
      <h3>Category</h3>
      <div id="category-filters"></div>

      <h3>Size</h3>
      <div id="size-filters"></div>

      <button class="filter-clear" id="clear-filters">Clear all</button>
    </aside>

    <div>
      <h2 class="section-title" style="text-align:left; margin-bottom:24px;">Shop All</h2>
      <div class="shop-grid" id="shop-grid"></div>
    </div>
  </div>
</section>

<footer class="footer">
  G&amp;M — Gold &amp; Molly &nbsp;·&nbsp; Peace, God, and unity across cultures &nbsp;·&nbsp; Prototype build
</footer>

<script src="products.js"></script>
<script src="garments.js"></script>
<script src="cart.js"></script>
<script>
  const categories = [...new Set(PRODUCTS.map(p => p.category))];
  const sizes = ["S", "M", "L", "XL"];
  const state = { categories: new Set(), sizes: new Set() };

  document.getElementById("category-filters").innerHTML = categories.map(c => `
    <label class="filter-option">
      <input type="checkbox" value="${c}" data-filter="category"> ${c}
    </label>
  `).join("");

  document.getElementById("size-filters").innerHTML = sizes.map(s => `
    <label class="filter-option">
      <input type="checkbox" value="${s}" data-filter="size"> ${s}
    </label>
  `).join("");

  document.querySelectorAll('input[data-filter]').forEach(input => {
    input.addEventListener("change", () => {
      const set = input.dataset.filter === "category" ? state.categories : state.sizes;
      input.checked ? set.add(input.value) : set.delete(input.value);
      render();
    });
  });

  document.getElementById("clear-filters").addEventListener("click", () => {
    state.categories.clear();
    state.sizes.clear();
    document.querySelectorAll('input[data-filter]').forEach(i => i.checked = false);
    render();
  });

  function render() {
    const filtered = PRODUCTS.filter(p => {
      const catOk = state.categories.size === 0 || state.categories.has(p.category);
      const sizeOk = state.sizes.size === 0 || p.sizes.some(s => state.sizes.has(s));
      return catOk && sizeOk;
    });

    const grid = document.getElementById("shop-grid");
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state">No products match those filters. Try clearing a few.</div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => `
      <a class="product-card" href="product.html?id=${p.id}">
        <div class="swatch">
          <img src="images/logo.png" alt="G&amp;M logo" class="badge">
          ${garmentSVG(p.category, p.fill, p.ink)}
        </div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-price">${formatPrice(p.price)}</div>
        </div>
      </a>
    `).join("");
  }

  render();
</script>
</body>
</html>
